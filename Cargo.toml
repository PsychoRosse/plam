[package]
name = "plam"
version = "0.2.0"
edition = "2024"
description = "A lightweight mathematics library for 2D and 3D game development."
license = "MIT OR Apache-2.0"
repository = "https://github.com/PsychoRosse/plam"
readme = "README.md"
keywords = ["math"]
categories = ["game-development"]

[lib]
path = "src/_lib.rs"

[dependencies]
thiserror = { version = "2.0.21" }

clama = { version = "0.1.0", optional = true }

serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
default = ["serde", "clama"]
serde = ["dep:serde"]
clama = ["dep:clama"]
