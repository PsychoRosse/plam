[package]
name = "plam"
version = "0.2.0"
edition = "2024"
authors = ["PsychoRosse"]
repository = "https://github.com/PsychoRosse/plam"
homepage = "https://github.com/PsychoRosse/plam"
keywords = ["math", "gamedev", "gamedev-library"]
categories = ["mathematics", "game-development"]
license = "MIT OR Apache-2.0"

[lib]
path = "src/_lib.rs"

[dependencies]
thiserror = { version = "2.0.21" }

serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]
